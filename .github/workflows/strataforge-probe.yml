name: Build StrataForge iOS probe
on:
  workflow_dispatch:
  push:
    branches:
      - feature/strataforge-feasibility
    paths:
      - 'strataforge-probe/**'
      - '.github/workflows/strataforge-probe.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS Xcode project
        working-directory: strataforge-probe
        run: xcodegen generate
      - name: Compile unsigned iOS preflight
        working-directory: strataforge-probe
        run: |
          set -o pipefail
          xcodebuild -project StrataForgeProbe.xcodeproj -scheme StrataForgeProbe -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Package minimal Strata source IPA
        working-directory: strataforge-probe
        run: |
          set -euo pipefail
          mkdir Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/StrataForgeProbe.app Payload/
          test -x Payload/StrataForgeProbe.app/StrataForgeProbe
          zip -qr StrataForgeProbe-unsigned.ipa Payload
          unzip -t StrataForgeProbe-unsigned.ipa
      - name: Publish minimal probe package to GitHub Releases
        if: github.ref == 'refs/heads/feature/strataforge-feasibility' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: strataforge-probe
        run: |
          set -euo pipefail
          TAG="strataforge-probe-${{ github.run_number }}"
          gh release create "$TAG" StrataForgeProbe-unsigned.ipa --repo "${{ github.repository }}" --title "StrataForge probe $TAG" --notes "Small unsigned Strata diagnostics guest. Not a Windows emulator or Steam downloader." --target "${{ github.sha }}"
      - name: Add verified release to Strata app source
        if: github.ref == 'refs/heads/feature/strataforge-feasibility' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp strataforge-probe/StrataForgeProbe-unsigned.ipa StrataForgeProbe-unsigned.ipa
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B strataforge-feed origin/main
            python3 tools/publish_strataforge_probe.py "strataforge-probe-${{ github.run_number }}" "${{ github.run_number }}" StrataForgeProbe-unsigned.ipa apps.json
            git add apps.json
            git commit -m "source: publish StrataForge probe ${{ github.run_number }}" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: StrataForgeProbe-build-logs
          path: |
            strataforge-probe/build.log
          if-no-files-found: warn
