name: Build clean CSNZ Madeira IPA
on:
  push:
    branches: [csnz-smc-diag-clean]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MADEIRA_ALLOW_NO_D3D12: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install host tools
        run: |
          brew install cmake ninja meson pkg-config bison ccache freetype
          rustup target add aarch64-apple-ios
          BREW_BISON="$(brew --prefix bison)/bin"
          echo "$BREW_BISON" >> "$GITHUB_PATH"
          export PATH="$BREW_BISON:$PATH"
          bison --version
          mkdir -p research
          ln -sfn "$(brew --prefix freetype)" research/freetype
          echo "$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin" >> "$GITHUB_PATH"

      - name: Install llvm-mingw
        run: |
          mkdir -p toolchains
          curl -fL --retry 3 -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  /tmp/llvm-mingw.tar.xz" | shasum -a 256 -c -
          tar -xJf /tmp/llvm-mingw.tar.xz -C toolchains

      - name: Configure Wine generated headers
        run: |
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --without-x --disable-tests
          make -j"$(sysctl -n hw.ncpu)" include/dwrite.h include/dwrite_1.h include/dwrite_2.h include/dwrite_3.h include/wtypes.h include/wtypesbase.h include/objidl.h include/objidlbase.h include/unknwn.h include/mfobjects.h include/mftransform.h
          test -s include/dwrite.h
          test -s include/wtypes.h
          test -s include/objidlbase.h
          test -s include/unknwn.h
          test -s include/mfobjects.h
          test -s include/mftransform.h

      - name: Restore reusable Madeira build kit
        id: kit
        uses: actions/cache@v4
        with:
          path: |
            toolchains/gnutls-ios
            toolchains/ffmpeg-ios
            app/Madeira/libntdll_unix.a
            build/ntdll-unix/obj/libntdll_unix.a
          key: madeira-kit-${{ runner.os }}-${{ runner.arch }}-4e9d45a-v1

      - name: Build media and crypto dependencies
        if: steps.kit.outputs.cache-hit != 'true'
        run: |
          bash build/gnutls-ios/build.sh
          bash build/ffmpeg/build.sh

      - name: Configure Wine ARM64EC generated headers
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          mkdir -p wine/build-arm64ec
          cd wine/build-arm64ec
          ../configure --enable-archs=arm64ec --without-x --disable-tests --enable-winegstreamer
          make -j"$(sysctl -n hw.ncpu)" include

      - name: Build Wine iOS unix library with CSNZ diagnostic
        if: steps.kit.outputs.cache-hit != 'true'
        run: |
          # Xcode 26 removed ri_page_wait_time_mach; it is telemetry only.
          sed -i '' 's/XP_MS( ru\.ri_page_wait_time_mach - pru\.ri_page_wait_time_mach )/0.0/' build/ntdll-unix/server_ios.c
          bash build/ntdll-unix/build.sh

      - name: Recompile only patched Wine objects
        if: steps.kit.outputs.cache-hit == 'true'
        run: |
          # Xcode 26 removed this telemetry field; no runtime semantics depend on it.
          sed -i '' 's/XP_MS( ru\.ri_page_wait_time_mach - pru\.ri_page_wait_time_mach )/0.0/' build/ntdll-unix/server_ios.c
          bash build/ntdll-unix/compile_patched.sh

      - name: Gate Wine unix library
        run: |
          test -s app/Madeira/libntdll_unix.a
          test -s build/ntdll-unix/obj/dwrite_unixlib.o
          test -s build/ntdll-unix/obj/winegstreamer_unixlib.o

      - name: Build Wine support libraries
        run: |
          bash build/wineserver/build.sh
          bash build/win32u-unix/build.sh
          bash build/wine-pe/build-ntdll.sh

      - name: Build FEX
        run: |
          bash build/fex-ios/build.sh
          bash build/fex-arm64ec/build.sh

      - name: Build pairing library
        run: bash build/rppairing-ios/build.sh

      - name: Build LLVM host tablegen
        run: |
          git clone --filter=blob:none https://github.com/llvm/llvm-project.git toolchains/llvm-project
          git -C toolchains/llvm-project checkout 8dfdcc7b7
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-host-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_TARGETS_TO_BUILD="" -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_PROJECTS="" -DLLVM_ENABLE_ZLIB=OFF
          cmake --build toolchains/llvm-host-build --target llvm-tblgen

      - name: Build LLVM iOS libraries
        run: |
          python3 - <<'PY'
          p='toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake'
          s=open(p).read()
          s=s.replace('MATCHES "Darwin"', 'MATCHES "Darwin|iOS"')
          open(p,'w').write(s)
          PY
          cmake -S toolchains/llvm-project/llvm -B toolchains/llvm-ios-build -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_HOST_TRIPLE=arm64-apple-ios17.0 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=arm64-apple-ios17.0 -DLLVM_TARGET_ARCH=host \
            -DLLVM_TARGETS_TO_BUILD="" -DLLVM_ENABLE_PROJECTS="" -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_TABLEGEN="$PWD/toolchains/llvm-host-build/bin/llvm-tblgen"
          cmake --build toolchains/llvm-ios-build

      - name: Build DXMT iOS combined library
        run: |
          xcodebuild -downloadComponent MetalToolchain || true
          bash build/dxmt-ios/build.sh
          xcrun -sdk iphoneos libtool -static -o build/dxmt-ios/libdxmt_combined.a \
            build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/libdxmt_combined.a

      - name: Satisfy intentionally unbundled VC runtime resource
        run: mkdir -p app/Madeira/x86_64-vcruntime

      - name: Stage licenses
        run: bash build/stage-licenses.sh

      - name: Build unsigned app
        run: |
          rm -rf /tmp/MadeiraDerived
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/MadeiraDerived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          APP="$(find /tmp/MadeiraDerived/Build/Products -type d -name Madeira.app | head -1)"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/Madeira.app
          /usr/bin/codesign --force --sign - Payload/Madeira.app || true
          ditto -c -k --sequesterRsrc --keepParent Payload Madeira-CSNZ-SMC-Diagnostic.ipa
          shasum -a 256 Madeira-CSNZ-SMC-Diagnostic.ipa > Madeira-CSNZ-SMC-Diagnostic.ipa.sha256
          ls -lh Madeira-CSNZ-SMC-Diagnostic.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Madeira-CSNZ-SMC-Diagnostic
          path: |
            Madeira-CSNZ-SMC-Diagnostic.ipa
            Madeira-CSNZ-SMC-Diagnostic.ipa.sha256
            build/ntdll-unix/obj/*.err
          if-no-files-found: warn
          retention-days: 14
