name: StrataForge app source validation
on:
  workflow_dispatch:
    inputs:
      run_macos:
        description: 'Request Xcode/macOS syntax verification (may queue if macOS minutes are exhausted)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/strataforge-app-source-validation.yml'
permissions:
  contents: read
jobs:
  portable-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/strataforge-feasibility
          submodules: false
      - name: Validate crash journal, build registration, and sanitizers
        run: |
          set -euo pipefail
          python3 -m py_compile tools/strataforge_sanitize.py tools/strataforge_native_inputs.py tools/strataforge_patch_fex_host_diagnostics.py
          bash -n tools/bootstrap_llvm_mingw_macos.sh tools/bootstrap_llvm_ios_macos.sh
          python3 tools/test_strataforge_sanitize.py
          test -s app/Madeira/StrataForgeCrashReporter.swift
          grep -Fq 'StrataForgeCrashReporter.swift in Sources' app/Madeira.xcodeproj/project.pbxproj
          grep -Fq 'StrataForgeCrashReporter.shared.launch()' app/Madeira/MadeiraApp.swift
          grep -Fq 'Relay accepted diagnostic events' app/Madeira/StrataForgeCrashReporter.swift
  swift-source:
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos == true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/strataforge-feasibility
          submodules: false
      - name: Swift syntax and project registration
        run: |
          set -euo pipefail
          xcrun swiftc -frontend -parse app/Madeira/StrataForgeCrashReporter.swift
          xcrun swiftc -frontend -parse app/Madeira/MadeiraApp.swift
          xcrun swiftc -frontend -parse app/Madeira/ContentView.swift
          grep -Fq 'StrataForgeCrashReporter.swift in Sources' app/Madeira.xcodeproj/project.pbxproj
          xcodebuild -list -project app/Madeira.xcodeproj
