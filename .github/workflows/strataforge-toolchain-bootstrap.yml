name: StrataForge verified toolchain bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mingw:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/strataforge-feasibility
          submodules: false
      - name: Download verified ARM64EC cross compiler
        run: bash tools/bootstrap_llvm_mingw_macos.sh
      - name: Verify compiler binaries
        run: |
          set -euo pipefail
          test -x toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/arm64ec-w64-mingw32-clang
          file toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin/arm64ec-w64-mingw32-clang
      - uses: actions/upload-artifact@v4
        with:
          name: strataforge-llvm-mingw-verified
          path: toolchains/llvm-mingw-20260421-ucrt-macos-universal/
          retention-days: 14
