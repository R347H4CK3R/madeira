name: Audit upstream Madeira release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official upstream baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/madeira-reference"
          cd "$RUNNER_TEMP/madeira-reference"
          curl -fL --retry 3 -o Madeira-0.1.3.ipa https://github.com/willfaust/Madeira/releases/download/v0.1.3/Madeira-0.1.3.ipa
          printf '%s  %s\n' '71e900cbc140778bd6fa67c1062821981ed98e6bfb674d853cfeefd6d242e1c0' Madeira-0.1.3.ipa | shasum -a 256 --check
          unzip -t Madeira-0.1.3.ipa | tail -1
          unzip -Z1 Madeira-0.1.3.ipa | grep -E '^Payload/[^/]+/Info.plist$' | head -1 > app-info-path.txt
          test -s app-info-path.txt
          python3 - <<'PY'
          import zipfile,plistlib,json
          with zipfile.ZipFile('Madeira-0.1.3.ipa') as z:
              member=open('app-info-path.txt').read().strip()
              p=plistlib.loads(z.read(member))
              summary={k:p.get(k) for k in ('CFBundleIdentifier','CFBundleExecutable','CFBundleShortVersionString','MinimumOSVersion')}
              summary['files_in_ipa']=len(z.namelist())
              open('reference-summary.json','w').write(json.dumps(summary,indent=2)+'\n')
              print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: madeira-upstream-reference-report
          path: ${{ runner.temp }}/madeira-reference/reference-summary.json
          retention-days: 14
