name: Madeira macOS dependency and build probe
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wineserver-native-probe:
    name: Compile pinned Wine server for iOS arm64
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout exact Wine revision
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init wine
          test -s wine/server/Makefile.in
          git -C wine rev-parse HEAD | tee /tmp/madeira-wine-revision.txt
      - name: Install required Wine host build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix bison)/bin/bison" --version | head -1
      - name: Generate Wine host configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --disable-tests --without-x --without-alsa --without-cups --without-dbus --without-gphoto --without-gstreamer --without-oss --without-pulse --without-sane --without-udev 2>&1 | tee /tmp/madeira-wine-configure.log
          test -s include/config.h
      - name: Compile Wine server base
        shell: bash
        run: |
          set -o pipefail
          bash build/wineserver/build-base.sh 2>&1 | tee /tmp/madeira-wineserver-base.log
          test ${PIPESTATUS[0]} -eq 0
          xcrun --sdk iphoneos ar t build/wineserver/obj/libwineserver.a | grep -Fx 'request.o'
      - name: Validate candidate archive architecture
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s build/wineserver/obj/libwineserver.a
          xcrun --sdk iphoneos ar t build/wineserver/obj/libwineserver.a | tee /tmp/madeira-wineserver-members.txt
          test "$(grep -Fxc 'request.o' /tmp/madeira-wineserver-members.txt)" -eq 1
          mkdir -p /tmp/madeira-wineserver-architecture
          cd /tmp/madeira-wineserver-architecture
          xcrun --sdk iphoneos ar x "$GITHUB_WORKSPACE/build/wineserver/obj/libwineserver.a" request.o
          xcrun --sdk iphoneos lipo -archs request.o | tee /tmp/madeira-wineserver-arch.txt
          grep -Eq '(^| )arm64($| )' /tmp/madeira-wineserver-arch.txt
      - name: Save candidate native archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-wineserver-ios-arm64-base
          path: build/wineserver/obj/libwineserver.a
          if-no-files-found: error
      - name: Apply pinned Wine server iOS patches
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v llvm-objcopy >/dev/null 2>&1 && ! test -x /opt/homebrew/opt/llvm/bin/llvm-objcopy; then
            brew install llvm
          fi
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          command -v llvm-objcopy
          bash build/wineserver/build.sh all 2>&1 | tee /tmp/madeira-wineserver-patched.log
          test -s app/Madeira/libwineserver.a
          xcrun --sdk iphoneos ar t app/Madeira/libwineserver.a | tee /tmp/madeira-wineserver-patched-members.txt
          grep -Fxq 'request_ios.o' /tmp/madeira-wineserver-patched-members.txt
      - name: Save patched Wine server archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-wineserver-ios-arm64-patched
          path: app/Madeira/libwineserver.a
          if-no-files-found: error
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-wineserver-compile-diagnostics
          path: |
            /tmp/madeira-wine-revision.txt
            /tmp/madeira-wine-configure.log
            /tmp/madeira-wineserver-base.log
            /tmp/madeira-wineserver-members.txt
            /tmp/madeira-wineserver-arch.txt
            /tmp/madeira-wineserver-patched.log
            /tmp/madeira-wineserver-patched-members.txt
          if-no-files-found: warn
      - name: Report base build result
        if: always()
        shell: bash
        run: |
          echo "### Pinned Wine server iOS-arm64 compile probe" >> "$GITHUB_STEP_SUMMARY"
          if test -s app/Madeira/libwineserver.a; then
            echo "Patched Wine server archive produced; complete IPA link and device runtime remain unverified." >> "$GITHUB_STEP_SUMMARY"
          elif test -s build/wineserver/obj/libwineserver.a; then
            echo "Base Wine server archive produced; patched archive was not completed. See build logs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No candidate archive produced. See uploaded configure/compile diagnostics." >> "$GITHUB_STEP_SUMMARY"
          fi
