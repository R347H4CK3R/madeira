name: Madeira macOS dependency and build probe
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/strata-wine-jit-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Inspect Xcode and pinned submodules
        shell: bash
        run: |
          set -uo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          git submodule sync --recursive
          git submodule update --init --recursive 2>&1 | tee /tmp/madeira-submodules.log
          test ${PIPESTATUS[0]} -eq 0 || { echo "::error::Pinned submodule commit unavailable; cannot safely build source"; exit 1; }
      - name: Bootstrap recoverable dependencies
        shell: bash
        run: |
          set -o pipefail
          bash tools/bootstrap-strata-deps.sh --install 2>&1 | tee /tmp/madeira-bootstrap.log
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-build-prerequisite-logs
          path: |
            /tmp/madeira-submodules.log
            /tmp/madeira-bootstrap.log
          if-no-files-found: warn
      - name: Build readiness report
        if: always()
        shell: bash
        run: |
          echo "### Madeira dependency verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Missing toolchain/native archives must be built before Xcode compilation." >> "$GITHUB_STEP_SUMMARY"
          if test -f /tmp/madeira-submodules.log; then tail -30 /tmp/madeira-submodules.log >> "$GITHUB_STEP_SUMMARY"; fi

  wineserver-native-probe:
    name: Compile pinned Wine server for iOS arm64
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout exact Wine revision
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init wine
          test -s wine/server/Makefile.in
          git -C wine rev-parse HEAD | tee /tmp/madeira-wine-revision.txt
      - name: Generate Wine host configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --disable-tests --without-x --without-alsa --without-cups --without-dbus --without-gphoto --without-gstreamer --without-oss --without-pulse --without-sane --without-udev 2>&1 | tee /tmp/madeira-wine-configure.log
          test -s include/config.h
      - name: Compile Wine server base
        shell: bash
        run: |
          set -o pipefail
          bash build/wineserver/build-base.sh 2>&1 | tee /tmp/madeira-wineserver-base.log
          test ${PIPESTATUS[0]} -eq 0
          xcrun --sdk iphoneos ar t build/wineserver/obj/libwineserver.a | grep -Fx 'request.o'
      - name: Preserve compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-wineserver-compile-diagnostics
          path: |
            /tmp/madeira-wine-revision.txt
            /tmp/madeira-wine-configure.log
            /tmp/madeira-wineserver-base.log
          if-no-files-found: warn
      - name: Report base build result
        if: always()
        shell: bash
        run: |
          echo "### Pinned Wine server iOS-arm64 compile probe" >> "$GITHUB_STEP_SUMMARY"
          if test -s build/wineserver/obj/libwineserver.a; then
            echo "Candidate archive produced; complete IPA link and device runtime remain unverified." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No candidate archive produced. See uploaded configure/compile diagnostics." >> "$GITHUB_STEP_SUMMARY"
          fi
