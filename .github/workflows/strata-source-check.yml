name: Strata compatibility source checks
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/strata-wine-jit-20261030
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard macOS workflow against duplicate jobs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w = Path(".github/workflows/madeira-macos-build-probe.yml").read_text()
          assert w.count("    runs-on: macos-15") == 1 and w.count("    runs-on: ") == 1, "Expected exactly one pinned macOS 15 compiler job"
          assert "  wineserver-native-probe:" in w
          assert "  probe:" not in w, "Redundant macOS dependency job returned"
          assert "brew install bison" in w, "Wine host Bison prerequisite missing"
          bootstrap = Path("tools/bootstrap-strata-deps.sh").read_text()
          assert "Install pinned ARM64 PE cross-toolchain" in w, "ARM64 PE compiler setup missing"
          assert "shasum -a 256 -c -" in w, "PE toolchain download must verify SHA-256"
          assert "aarch64-w64-mingw32-clang" in w, "PE cross-compiler is not tested"
          assert "CC=/usr/bin/clang CXX=/usr/bin/clang++" in w, "Host compiler must stay native"
          import re
          for key in ("llvm-mingw-20260421-ucrt-macos-universal", "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7"):
              assert key in w and key in bootstrap, f"Pinned PE toolchain mismatch: {key}"
          assert "if: always()" in w, "Compiler diagnostics must persist after failure"
          print("PASS: single macOS Wine build job and diagnostic retention")
          PY
      - name: Check Wine server build scripts
        run: |
          bash -n build/wineserver/build-base.sh
          bash -n build/wineserver/build.sh
          python3 - <<'PY'
          from pathlib import Path
          base = Path("build/wineserver/build-base.sh").read_text()
          patch = Path("build/wineserver/build.sh").read_text()
          assert 'server/Makefile.in' in base
          assert 'FILES=()' in base
          assert 'xcrun --sdk iphoneos clang' in base
          assert 'bash "$BUILD_DIR/build-base.sh"' in patch
          assert "grep -Fxq 'request.o'" in patch
          print("PASS: clean Wine server source-build path is wired")
          print("NOTE: native compile and runtime remain unverified")
          PY
      - name: Test dependency bootstrap failure handling
        run: |
          python3 tests/host/test-strata-bootstrap.py
          python3 tests/host/check-jit-method.py
      - name: Check Wine fallback and JIT integration blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("build/wineserver/request_ios.c").read_text()
          required=[
              'if (errno == EPERM || errno == EACCES)',
              'socketpair(AF_UNIX, SOCK_STREAM, 0, pair)',
              'ios_master_injected_only = 1;',
              'if (!ios_master_injected_only)',
              'void master_socket_handle_client(int client_fd)'
          ]
          for item in required:
              assert item in s, f"Missing Wine fallback element: {item}"
          j=Path("app/Madeira/JITBuiltInHost.swift").read_text()
          assert 'getenv("LC_HOME_PATH")' in j
          view=Path("app/Madeira/ContentView.swift").read_text()
          assert 'getenv("LC_HOME_PATH") != nil && !StikJITHelper.ready' in view
          assert '[strata-jit]' in view
          print("PASS: Experimental Wine fallback source checks")
          print("PASS: Strata guest JIT diagnostic path present")
          print("BLOCKED: Host-side Strata BRK script integration requires device testing")
          print("NOTE: This source check is not an iOS build or runtime compatibility test")
          PY
