name: COD ARM64EC fix build

on:
  workflow_dispatch:
  push:
    branches:
      - cod-store-emulator-fix

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Xcode info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config meson ninja cmake bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Install pinned Madeira llvm-mingw
        run: |
          mkdir -p toolchains
          gh release download 20260421 --repo mstorsjo/llvm-mingw --pattern 'llvm-mingw-20260421-ucrt-macos-universal.tar.xz' --dir toolchains
          cd toolchains
          echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  llvm-mingw-20260421-ucrt-macos-universal.tar.xz" | shasum -a 256 -c -
          tar -xJf llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          echo "$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin" >> "$GITHUB_PATH"

      - name: Configure Wine host tree
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$(brew --prefix bison)/bin:$PATH"\n          command -v aarch64-w64-mingw32-clang\n          command -v llvm-dlltool\n          command -v ld.lld\n          export LDFLAGS="-L$(brew --prefix llvm)/lib"\n          export CPPFLAGS="-I$(brew --prefix llvm)/include"
          bison --version
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --without-x --disable-tests --enable-winegstreamer

      - name: Build iOS ntdll unix library
        run: |
          chmod +x build/ntdll-unix/build.sh
          build/ntdll-unix/build.sh

      - name: Build unsigned Madeira app
        run: |
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Debug-iphoneos/Madeira.app' -print -quit)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/Madeira.app
          /usr/bin/zip -qry Madeira-COD-ARM64EC-fix.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Madeira-COD-ARM64EC-fix
          path: Madeira-COD-ARM64EC-fix.ipa
